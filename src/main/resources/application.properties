quarkus.application.name=corpoario-notifications

# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/notifications}
quarkus.datasource.username=${DB_USERNAME:notifications}
quarkus.datasource.password=${DB_PASSWORD:notifications}

# Hibernate: o esquema é gerenciado pelo Flyway
quarkus.hibernate-orm.database.generation=none

# Flyway (scripts em src/main/resources/db/migration)
quarkus.flyway.migrate-at-start=true

# RabbitMQ (canais devem ser declarados ao implementar os consumidores)
rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USERNAME:guest}
rabbitmq-password=${RABBITMQ_PASSWORD:guest}

# SMTP
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.username=${SMTP_USERNAME:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.from=${SMTP_FROM:no-reply@example.com}
quarkus.mailer.start-tls=${SMTP_START_TLS:OPTIONAL}
quarkus.mailer.ssl=${SMTP_SSL:false}

# OpenAPI, health e métricas
quarkus.smallrye-openapi.path=/q/openapi
quarkus.micrometer.export.prometheus.path=/q/metrics
